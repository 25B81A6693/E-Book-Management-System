<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #1e293b;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 35px;
            color: #38bdf8;
        }

        .sidebar a {
            display: block;
            padding: 14px 18px;
            margin: 8px 0;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #334155;
            color: white;
        }

        /* Main */
        .main {
            margin-left: 240px;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
        }

        .profile {
            background: white;
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        /* Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #0f172a;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        select,
        button {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        select {
            border: 1px solid #ddd;
            background: white;
        }

        .btn {
            background: #0284c7;
            color: white;
        }

        .btn:hover {
            background: #0369a1;
        }

        /* Ebook Grid */
        .ebook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .ebook-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            transition: .2s;
        }

        .ebook-card:hover {
            transform: translateY(-4px);
        }

        .cover {
            height: 180px;
            background: linear-gradient(135deg, #0284c7, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .ebook-content {
            padding: 18px;
        }

        .ebook-content h3 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        .author {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .progress-container {
            background: #e5e7eb;
            height: 7px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .progress {
            height: 7px;
            background: #22c55e;
            border-radius: 5px;
        }

        .card-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .read-btn {
            flex: 1;
            background: #22c55e;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 450px;
            max-width: 100%;
            padding: 25px;
            border-radius: 12px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .sidebar a {
                display: inline-block;
            }

            .main {
                margin-left: 0;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>📚 EBOOKS</h2>

    <a class="active" onclick="showSection('dashboard')">
        🏠 Dashboard
    </a>

    <a onclick="showSection('ebooks')">
        📖 All Ebooks
    </a>

    <a onclick="showSection('favorites')">
        ❤️ Favorites
    </a>

    <a onclick="showSection('settings')">
        ⚙️ Settings
    </a>
</div>


<!-- Main Content -->
<div class="main">

    <div class="header">
        <h1>Ebook Management System</h1>
        <div class="profile">👤 Admin</div>
    </div>


    <!-- Statistics -->
    <div class="stats">

        <div class="stat-card">
            <h3>Total Ebooks</h3>
            <p id="totalBooks">0</p>
        </div>

        <div class="stat-card">
            <h3>Categories</h3>
            <p id="totalCategories">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedBooks">0</p>
        </div>

        <div class="stat-card">
            <h3>Reading</h3>
            <p id="readingBooks">0</p>
        </div>

    </div>


    <!-- Toolbar -->
    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="🔍 Search ebooks..."
            onkeyup="displayBooks()"
        >

        <select id="categoryFilter" onchange="displayBooks()">
            <option value="all">All Categories</option>
        </select>

        <button class="btn" onclick="openModal()">
            + Add Ebook
        </button>

    </div>


    <!-- Ebook List -->
    <div id="ebookGrid" class="ebook-grid"></div>

</div>


<!-- Add/Edit Modal -->
<div id="modal" class="modal">

    <div class="modal-box">

        <h2 id="modalTitle">Add Ebook</h2>

        <div class="form-group">
            <label>Ebook Title</label>
            <input type="text" id="bookTitle" placeholder="Enter title">
        </div>

        <div class="form-group">
            <label>Author</label>
            <input type="text" id="bookAuthor" placeholder="Enter author">
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" id="bookCategory" placeholder="Enter category">
        </div>

        <div class="form-group">
            <label>Reading Progress (%)</label>
            <input type="number" id="bookProgress"
                   min="0" max="100" value="0">
        </div>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal()">
                Cancel
            </button>

            <button class="btn" onclick="saveBook()">
                Save Ebook
            </button>

        </div>

    </div>

</div>


<script>

    /* Initial Data */

    let books = JSON.parse(localStorage.getItem("ebooks")) || [
        {
            id: 1,
            title: "Introduction to HTML",
            author: "John Smith",
            category: "Programming",
            progress: 80
        },
        {
            id: 2,
            title: "JavaScript Basics",
            author: "David Miller",
            category: "Programming",
            progress: 45
        },
        {
            id: 3,
            title: "The Art of Photography",
            author: "Sarah Wilson",
            category: "Photography",
            progress: 100
        },
        {
            id: 4,
            title: "Business Management",
            author: "Robert Brown",
            category: "Business",
            progress: 20
        }
    ];

    let editId = null;


    /* Save data */

    function saveData() {
        localStorage.setItem("ebooks", JSON.stringify(books));
    }


    /* Display ebooks */

    function displayBooks() {

        const grid = document.getElementById("ebookGrid");

        const search =
            document.getElementById("searchInput")
            .value.toLowerCase();

        const category =
            document.getElementById("categoryFilter").value;

        const filteredBooks = books.filter(book => {

            const matchesSearch =
                book.title.toLowerCase().includes(search) ||
                book.author.toLowerCase().includes(search);

            const matchesCategory =
                category === "all" ||
                book.category === category;

            return matchesSearch && matchesCategory;
        });


        grid.innerHTML = "";


        if (filteredBooks.length === 0) {

            grid.innerHTML = `
                <div style="grid-column:1/-1;
                            text-align:center;
                            padding:50px;">
                    <h2>📚 No ebooks found</h2>
                    <p>Try another search.</p>
                </div>
            `;

            updateStats();
            return;
        }


        filteredBooks.forEach(book => {

            const card = document.createElement("div");

            card.className = "ebook-card";

            card.innerHTML = `

                <div class="cover">
                    ${book.title}
                </div>

                <div class="ebook-content">

                    <h3>${book.title}</h3>

                    <div class="author">
                        By ${book.author}
                    </div>

                    <span class="category">
                        ${book.category}
                    </span>

                    <div>
                        Progress: ${book.progress}%
                    </div>

                    <div class="progress-container">
                        <div class="progress"
                             style="width:${book.progress}%">
                        </div>
                    </div>

                    <div class="card-buttons">

                        <button class="read-btn"
                            onclick="readBook(${book.id})">
                            📖 Read
                        </button>

                        <button class="edit-btn"
                            onclick="editBook(${book.id})">
                            ✏️
                        </button>

                        <button class="delete-btn"
                            onclick="deleteBook(${book.id})">
                            🗑️
                        </button>

                    </div>

                </div>
            `;

            grid.appendChild(card);
        });


        updateStats();
    }


    /* Update statistics */

    function updateStats() {

        document.getElementById("totalBooks").innerText =
            books.length;

        const categories =
            new Set(books.map(book => book.category));

        document.getElementById("totalCategories").innerText =
            categories.size;

        const completed =
            books.filter(book => book.progress === 100).length;

        document.getElementById("completedBooks").innerText =
            completed;

        const reading =
            books.filter(book =>
                book.progress > 0 && book.progress < 100
            ).length;

        document.getElementById("readingBooks").innerText =
            reading;

        updateCategories();
    }


    /* Update category dropdown */

    function updateCategories() {

        const select =
            document.getElementById("categoryFilter");

        const currentValue = select.value;

        const categories =
            [...new Set(books.map(book => book.category))];

        select.innerHTML =
            `<option value="all">All Categories</option>`;

        categories.forEach(category => {

            select.innerHTML += `
                <option value="${category}">
                    ${category}
                </option>
            `;
        });

        if (categories.includes(currentValue)) {
            select.value = currentValue;
        }
    }


    /* Open modal */

    function openModal() {

        editId = null;

        document.getElementById("modalTitle").innerText =
            "Add Ebook";

        document.getElementById("bookTitle").value = "";
        document.getElementById("bookAuthor").value = "";
        document.getElementById("bookCategory").value = "";
        document.getElementById("bookProgress").value = 0;

        document.getElementById("modal").style.display =
            "flex";
    }


    /* Close modal */

    function closeModal() {

        document.getElementById("modal").style.display =
            "none";
    }


    /* Save ebook */

    function saveBook() {

        const title =
            document.getElementById("bookTitle").value.trim();

        const author =
            document.getElementById("bookAuthor").value.trim();

        const category =
            document.getElementById("bookCategory").value.trim();

        const progress =
            parseInt(
                document.getElementById("bookProgress").value
            ) || 0;


        if (!title || !author || !category) {

            alert("Please fill in all fields.");
            return;
        }


        if (editId !== null) {

            const book =
                books.find(book => book.id === editId);

            book.title = title;
            book.author = author;
            book.category = category;
            book.progress = Math.min(100, Math.max(0, progress));

        } else {

            books.push({

                id: Date.now(),

                title: title,

                author: author,

                category: category,

                progress: Math.min(100, Math.max(0, progress))

            });
        }


        saveData();

        closeModal();

        displayBooks();
    }


    /* Edit ebook */

    function editBook(id) {

        const book =
            books.find(book => book.id === id);

        if (!book) return;

        editId = id;

        document.getElementById("modalTitle").innerText =
            "Edit Ebook";

        document.getElementById("bookTitle").value =
            book.title;

        document.getElementById("bookAuthor").value =
            book.author;

        document.getElementById("bookCategory").value =
            book.category;

        document.getElementById("bookProgress").value =
            book.progress;

        document.getElementById("modal").style.display =
            "flex";
    }


    /* Delete ebook */

    function deleteBook(id) {

        const book =
            books.find(book => book.id === id);

        if (!book) return;

        if (confirm(
            `Delete "${book.title}"?`
        )) {

            books =
                books.filter(book => book.id !== id);

            saveData();

            displayBooks();
        }
    }


    /* Read ebook */

    function readBook(id) {

        const book =
            books.find(book => book.id === id);

        if (!book) return;

        if (book.progress < 100) {

            book.progress =
                Math.min(100, book.progress + 10);

            saveData();

            displayBooks();

            alert(
                `"${book.title}" opened.\n\n` +
                `Reading progress: ${book.progress}%`
            );

        } else {

            alert(
                `"${book.title}" is already completed!`
            );
        }
    }


    /* Sidebar sections */

    function showSection(section) {

        if (section === "favorites") {

            alert("Favorites section coming soon.");

        } else if (section === "settings") {

            alert("Settings section coming soon.");

        } else if (section === "dashboard") {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        } else if (section === "ebooks") {

            document
                .getElementById("ebookGrid")
                .scrollIntoView({
                    behavior: "smooth"
                });
        }
    }


    /* Close modal when clicking outside */

    window.onclick = function(event) {

        const modal =
            document.getElementById("modal");

        if (event.target === modal) {
            closeModal();
        }
    };


    /* Initial display */

    displayBooks();

</script>

</body>
</html>
